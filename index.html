<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Beckett — Proof of Work</title>
    <meta
      name="description"
      content="Beckett in numbers: a live dashboard of an autonomous coding agent's real output — tickets, worker economics, spend, memory and system health, harvested from git and session logs."
    />
    <script>
      // Set the theme class before first paint so there is no light/dark flash.
      (function () {
        try {
          var saved = localStorage.getItem("bkt-theme");
          var dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
